title: PowerShell Launched With Encoded Command
id: a58e9a4a-1d51-487a-a911-5fe01a963aea
status: experimental
description: |
  Detects powershell.exe or pwsh.exe started with an -EncodedCommand flag (or
  one of its abbreviations). Attackers base64-encode PowerShell to hide
  download cradles and payloads from analysts and from simple command-line
  string matching.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/
author: BombDiggity2454
date: 2026-11-09
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense-evasion
  - attack.t1027
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    - Image|endswith:
        - '\powershell.exe'
        - '\pwsh.exe'
    # Catches a renamed powershell.exe copied to another name/path
    - OriginalFileName:
        - 'PowerShell.EXE'
        - 'pwsh.dll'
  selection_flag:
    # PowerShell accepts any unambiguous prefix of -EncodedCommand, and both
    # '-' and '/' (windash covers '/' and Unicode dashes as well).
    CommandLine|windash|contains:
      - ' -e '
      - ' -ec '
      - ' -en '
      - ' -enc '
      - ' -enco'
  condition: all of selection_*
falsepositives:
  - Software deployment and RMM tools (SCCM, Intune, some backup agents) that
    pass encoded scripts to avoid quoting issues. Baseline by ParentImage.
level: high
