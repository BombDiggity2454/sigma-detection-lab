title: Certutil Used to Download a File
id: b972fbd0-ca09-4fd6-8de3-fd57d0388b0b
status: experimental
description: |
  Detects certutil.exe invoked with the -urlcache or -verifyctl options, which
  can fetch arbitrary files from a URL. Certutil is a signed Microsoft binary,
  so attackers use it to download second-stage payloads past application
  allow-listing ("living off the land").
references:
  - https://attack.mitre.org/techniques/T1105/
  - https://lolbas-project.github.io/lolbas/Binaries/Certutil/
author: BombDiggity2454
date: 2026-11-09
tags:
  - attack.command-and-control
  - attack.t1105
  - attack.defense-evasion
  - attack.t1218
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    - Image|endswith: '\certutil.exe'
    - OriginalFileName: 'CertUtil.exe'
  selection_cli:
    CommandLine|contains:
      - 'urlcache'
      - 'verifyctl'
  condition: all of selection_*
falsepositives:
  - Administrators testing CRL / AIA reachability with -urlcache. Confirm the
    URL points at an internal PKI host and nothing was written to disk.
level: high
